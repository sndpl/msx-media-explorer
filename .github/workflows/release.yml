name: Release

on:
  push:
    tags:
      - "v*"
  # Allow building binaries on demand (Actions tab -> Run workflow) without
  # cutting a tagged release. Manual runs build all platforms and upload the
  # artifacts to the run; the `release` job below is skipped (it only runs for
  # tag pushes).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: mediaexplorer
  # Pinned so CI matches what the .app/.dmg flow was validated against locally.
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  # Linux and Windows ship the bare executable (Linux has no native bundle here;
  # Windows users run the .exe directly). macOS is handled by the `macos` job.
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p mediaexplorer-gui
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${BIN_NAME}-${{ matrix.target }}"
      - name: Package (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy "target\${{ matrix.target }}\release\${env:BIN_NAME}.exe" "dist\${env:BIN_NAME}-${{ matrix.target }}.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  # Builds a universal (arm64 + x86_64) .app, ad-hoc signs it, and packages a
  # .dmg. Ad-hoc signing (no Apple Developer ID / notarization) means the app is
  # valid and runs, but Gatekeeper still flags it as from an unidentified
  # developer on first launch: users right-click -> Open once, or run
  # `xattr -dr com.apple.quarantine "/Applications/MSX Media Explorer.app"`.
  macos:
    name: Build (macOS universal .app + .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked --version "${CARGO_PACKAGER_VERSION}"
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin -p mediaexplorer-gui
          cargo build --release --target x86_64-apple-darwin -p mediaexplorer-gui
      - name: Combine into a universal binary
        run: |
          mkdir -p target/release
          lipo -create -output "target/release/${BIN_NAME}" \
            "target/aarch64-apple-darwin/release/${BIN_NAME}" \
            "target/x86_64-apple-darwin/release/${BIN_NAME}"
          lipo -archs "target/release/${BIN_NAME}"
      - name: Build .app bundle
        run: |
          cargo packager --release -p mediaexplorer-gui \
            --formats app --out-dir dist --binaries-dir target/release
      - name: Ad-hoc sign and seal the bundle
        run: |
          APP="dist/MSX Media Explorer.app"
          # cargo-packager leaves the bundle unsealed (only the linker's ad-hoc
          # signature on the Mach-O); this re-signs and writes _CodeSignature so
          # the bundle passes strict verification and runs on Apple Silicon.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Package .dmg
        run: |
          APP="dist/MSX Media Explorer.app"
          STAGE="$(mktemp -d)/dmg"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "MSX Media Explorer" -srcfolder "$STAGE" \
            -ov -format UDZO "dist/${BIN_NAME}-macos-universal.dmg"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/${{ env.BIN_NAME }}-macos-universal.dmg

  release:
    name: Publish GitHub Release
    needs: [build, macos]
    # Only publish a GitHub Release for tag pushes; manual runs stop after the
    # build/macos jobs have uploaded their artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum -- * > SHA256SUMS
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
