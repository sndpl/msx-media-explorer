[package]
name = "msx-disk"
description = "Read, decode, and convert MSX floppy disk image formats (.dsk, .xsa, .cas, and more)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
# LHA/LZH/LArc decoding. Default features (std, lh1, lz) cover every method we
# need: lh0/lh1/lh4/lh5/lh6/lh7 (.lzh), lzs/lz4/lz5 (.lzs), and pm0 (.pma).
# PMA pm1/pm2 are not supported by delharc and are handled by `archive::pma`.
delharc = "0.6"
# Local-timezone conversion for restoring a FAT file's date on extraction.
# Already in the tree via delharc; the `clock` feature adds OS timezone access
# (thread-safe, unlike the `time` crate — this runs in the multithreaded GUI).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# DEFLATE decompression for zipped disk images. Pure Rust (no C toolchain),
# MIT/Zlib/Apache-2.0, and already compiled in this workspace — `flate2` pulls
# it in via `ureq`, `image` and `muda` — so this adds a dependency edge, not new
# third-party code. Only `inflate::decompress_to_vec_with_limit` is used.
miniz_oxide = "0.8"

[dev-dependencies]
image.workspace = true
