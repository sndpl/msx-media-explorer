[package]
name = "dskexplorer-gui"
description = "Cross-platform GUI for browsing and editing MSX disk images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "dskexplorer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
arboard = { version = "3.6.1", features = ["image-data"] }
eframe = "0.34.3"
egui = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
msx-disk = { path = "../msx-disk" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

# Native drag-out to the OS file manager (macOS + Windows only; Linux falls
# back to the Extract dialog).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1.1"
