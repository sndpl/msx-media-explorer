[package]
name = "mediaexplorer-gui"
description = "Cross-platform GUI for browsing and editing MSX disk and tape images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mediaexplorer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
arboard = { version = "3.6.1", features = ["image-data"] }
eframe = { version = "0.34.3", features = ["persistence"] }
egui = "0.34.3"
image.workspace = true
msx-disk = { path = "../msx-disk" }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# Re-reads eframe's on-disk app.ron at save time so two concurrently running
# instances merge (not clobber) each other's recent-files list. Same version
# eframe's `persistence` feature already pulls into the tree.
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# UI internationalization: compile-time-embedded YAML catalogs under `locales/`
# plus the `t!` lookup macro (MIT, pure Rust). Adding a language is one .yml file.
rust-i18n = "3"
# Default the UI language to the OS locale on first run (MIT/Apache, pure Rust).
sys-locale = "0.3"
# Update check: one blocking HTTPS GET to the GitHub releases API on a spawned
# thread (the app is otherwise async-free). Default features bundle rustls +
# webpki roots, so there is one TLS story on all three OSes with no system
# OpenSSL/schannel dependency. MIT/Apache-2.0, GPL-compatible.
ureq = "3"
# JSON: deserialize the GitHub release payload for the update check. Also used by
# the settings round-trip tests.
serde_json = "1"

[dev-dependencies]
# Test-only: parse the locale catalogs to assert their key sets match.
serde_yaml = "0.9"

# Native drag-out to the OS file manager (macOS + Windows only; Linux falls
# back to the Extract dialog).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2.1.1"

# macOS-only: native menu bar (muda) plus the app menu / About-panel name and
# icon at startup. The objc2 crates are already in the dependency tree via
# winit; versions track it.
[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSResponder",
    "NSImage",
] }
objc2-foundation = { version = "0.3", features = [
    "NSBundle",
    "NSData",
    "NSString",
    "NSProcessInfo",
] }

# cargo-packager: turns the compiled binary into a real desktop bundle
# (.app/.dmg on macOS). The binary is built separately (CI lipos the two
# macOS arches into one universal binary first), so there is intentionally no
# `before-packaging-command` here — packaging consumes whatever binary already
# sits in the target dir. Run locally with:
#   cargo build --release -p mediaexplorer-gui
#   cargo packager --release -p mediaexplorer-gui --formats app,dmg
[package.metadata.packager]
product-name = "MSX Media Explorer"
# Keep in sync with the Info.plist embedded in src/main.rs (INFO_PLIST_XML),
# which gives the unbundled dev binary the same name/identifier.
identifier = "io.github.sandy.mediaexplorer"
category = "Utility"
binaries = [{ path = "mediaexplorer", main = true }]
icons = [
    "assets/icons/icon.icns",
    "assets/icons/icon.ico",
    "assets/icons/icon.png",
    "assets/icons/128x128.png",
    "assets/icons/32x32.png",
]

[package.metadata.packager.macos]
minimum-system-version = "10.13"
