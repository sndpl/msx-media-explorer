[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "GPL-2.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # webpki-roots (the Mozilla CA set bundled with rustls, pulled in by ureq for
    # the update check). Permissive, no copyleft terms, GPL-compatible.
    "CDLA-Permissive-2.0",
    # clipboard-win and its error-code dependency, reached through arboard for
    # clipboard support on Windows. Permissive, OSI-approved and FSF Free/Libre,
    # no copyleft terms, GPL-compatible.
    "BSL-1.0",
    # Font licences, not code licences: they cover the font *data* that
    # epaint_default_fonts bundles (egui's default fonts, pulled in
    # unconditionally via epaint <- egui <- eframe). Nothing under these terms is
    # linked into the binary as code. The project already ships GNU Unifont under
    # OFL-1.1 by choice; see crates/mediaexplorer-gui/assets/fonts/README.md.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
